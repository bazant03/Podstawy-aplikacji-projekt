<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Apple Store - Najlepsze Produkty</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Winky+Sans:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/custom.css" rel="stylesheet" />
</head>

<body>
    <!-- Panel nawigacyjny -->
    <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand font-black" href="index.html">Apple Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item font-medium-gray"><a class="nav-link" aria-current="page"
                            href="index.html">Sklep</a></li>
                    <li class="nav-item font-medium-gray"><a class="nav-link" href="about-us.html">O nas</a></li>
                </ul>
                <form class="d-flex">
                    <button class="btn btn-outline-dark custom-button" type="submit">
                        <i class="bi-cart-fill me-1"></i>
                        Koszyk
                        <span class="badge ms-1 rounded-pill custom-badge">0</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Nagłówek -->
    <header class="py-5 border-bottom">
        <div class="container px-4 px-lg-5">
            <div class="text-center">
                <h1 class="display-5 fw-bolder">Twój Koszyk Zakupowy</h1>
                <p class="lead fw-normal text-muted mb-0">Sprawdź produkty i przejdź do finalizacji zamówienia.</p>
            </div>
        </div>
    </header>

    <!-- Sekcja z produktami -->
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="row gx-lg-5">
                <!-- Lista produktów -->
                <div class="col-lg-8">
                    <div id="cart-items-list">
                        <div class="text-center py-5" id="empty-cart-message-page">
                            <i class="bi bi-cart-x" style="font-size: 3rem;"></i>
                            <p class="lead mt-3">Twój koszyk jest pusty.</p>
                            <a href="index.html" class="btn btn-primary custom-button">Kontynuuj zakupy</a>
                        </div>
                    </div>
                </div>

                <!-- Podsumowanie -->
                <div class="col-lg-4">
                    <div class="card shadow-sm summary-card">
                        <div class="card-body">
                            <h4 class="card-title mb-4">Podsumowanie</h4>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    Łączna ilość produktów:
                                    <span id="cart-total-items">0</span>
                                </li>
                                <li class="list-group-item d-flex justify-content-between align-items-center fw-bold">
                                    Do zapłaty:
                                    <span id="cart-total-price-summary">0.00 PLN</span>
                                </li>
                            </ul>
                            <div class="d-grid gap-2 mt-4">
                                <button class="btn btn-lg custom-button" id="checkout-btn">Przejdź do
                                    kasy
                                </button>
                                <button class="btn btn-outline-danger mt-2" id="clear-cart-btn-page">Wyczyść
                                    Koszyk</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-5 custom-footer">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; bazant03 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>

</body>

</html>
